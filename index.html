<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cranea tu equipo!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cesped: #1F5B3A;
    --cesped-oscuro: #143F28;
    --cal: #F3F6F0;
    --cinta: #F2C230;
    --texto: #1B2A21;
    --suave: #5E6F64;
    --linea: #D5DDD3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Barlow", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    color: var(--texto);
    background: var(--cal);
  }

  /* Cabecera: mitad de cancha dibujada con cal */
  header {
    position: relative;
    overflow: hidden;
    background: var(--cesped);
    color: var(--cal);
    padding: 48px 24px 40px;
  }
  header::before {            /* círculo central */
    content: "";
    position: absolute;
    width: 360px; height: 360px;
    right: -120px; top: -90px;
    border: 3px solid rgba(243, 246, 240, .35);
    border-radius: 50%;
  }
  header::after {             /* línea de mitad de cancha */
    content: "";
    position: absolute;
    top: 0; bottom: 0; right: 58px;
    border-left: 3px solid rgba(243, 246, 240, .35);
  }
  .cabecera { position: relative; max-width: 720px; margin: 0 auto; }
  h1 {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 800;
    font-size: clamp(48px, 11vw, 88px);
    line-height: .95;
    margin: 0;
    letter-spacing: -.01em;
  }
  .bajada { margin: 12px 0 0; max-width: 34ch; opacity: .9; }
  .usuario { display: flex; gap: 12px; align-items: center; margin-top: 20px; }

  main { max-width: 720px; margin: 0 auto; padding: 32px 24px 64px; }
  h2 {
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: 30px;
    margin: 40px 0 12px;
  }
  h3 { font-size: 17px; margin: 24px 0 6px; color: var(--cesped); }
  p { margin: 0 0 12px; }
  .nota { color: var(--suave); font-size: 15px; }

  button {
    font: 600 16px "Barlow", sans-serif;
    border: 0;
    border-radius: 6px;
    padding: 10px 18px;
    cursor: pointer;
    background: var(--cinta);
    color: var(--texto);
  }
  button.secundario {
    background: transparent;
    color: inherit;
    border: 2px solid currentColor;
    padding: 6px 14px;
  }
  button:focus-visible, select:focus-visible {
    outline: 3px solid var(--cinta);
    outline-offset: 2px;
  }
  select {
    font: 16px "Barlow", sans-serif;
    padding: 9px 10px;
    border: 2px solid var(--linea);
    border-radius: 6px;
    background: #fff;
    max-width: 100%;
  }
  .fila { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

  .estado {
    border-left: 6px solid var(--cesped);
    background: #fff;
    padding: 18px 20px;
  }
  .estado.pendiente { border-left-color: var(--cinta); }

  table { width: 100%; border-collapse: collapse; }
  td { padding: 7px 0; border-bottom: 1px solid var(--linea); }
  td.precio {
    text-align: right;
    font-family: "Barlow Condensed", sans-serif;
    font-weight: 600;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
  }
  .error { color: #A12A1E; font-weight: 600; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="cabecera">
    <h1>Cranea tu<br>equipo!</h1>
    <p class="bajada">El fantasy del club. Armá tu once de seis y sumá puntos sábado a sábado.</p>
    <div class="usuario" id="barra-usuario" hidden>
      <span id="nombre-usuario"></span>
      <button class="secundario" id="btn-salir">Salir</button>
    </div>
  </div>
</header>

<main>
  <!-- Sin sesión -->
  <section id="vista-login" hidden>
    <h2>Entrá con tu cuenta de Google</h2>
    <p>Usá la misma cuenta cada vez: tu equipo y tus puntos quedan asociados a ella.</p>
    <button id="btn-login">Entrar con Google</button>
  </section>

  <!-- Con sesión -->
  <section id="vista-app" hidden>
    <div id="estado" class="estado"></div>

    <section id="panel-admin" hidden>
      <h2>Aprobar jugadores</h2>
      <div id="lista-pendientes"></div>
    </section>

    <h2>Plantel</h2>
    <p class="nota" id="texto-presupuesto"></p>
    <div id="plantel"></div>
  </section>

  <p class="error" id="error" hidden></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ==== CONFIGURACIÓN: completá con los datos de tu proyecto ====
  // Supabase > Project Settings > API Keys. La publishable (o anon) key es pública:
  // la seguridad la dan las reglas RLS de la base, no esta clave.
  const SUPABASE_URL = "https://miuybthscredwyhslotd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Bt-dprsAYAVLXRsX7XaBfg_ygHrJ0M6";
  // ===============================================================

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);
  const POSICIONES = { ARQ: "Arqueros", DEF: "Defensores", MID: "Mediocampistas", DEL: "Delanteros" };

  function mostrarError(msg) {
    $("error").textContent = msg;
    $("error").hidden = !msg;
  }

  function el(tag, texto, clase) {
    const e = document.createElement(tag);
    if (texto !== undefined) e.textContent = texto;
    if (clase) e.className = clase;
    return e;
  }

  // ---------- Login / logout ----------
  $("btn-login").onclick = () =>
    sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + window.location.pathname },
    });

  $("btn-salir").onclick = () => sb.auth.signOut();

  // setTimeout evita llamar a Supabase dentro del callback de auth (puede trabarse)
  sb.auth.onAuthStateChange((_evento, sesion) => setTimeout(() => render(sesion), 0));

  // ---------- Render principal ----------
  async function render(sesion) {
    mostrarError("");
    $("vista-login").hidden = !!sesion;
    $("vista-app").hidden = !sesion;
    $("barra-usuario").hidden = !sesion;
    if (!sesion) return;

    const uid = sesion.user.id;
    const [perfilRes, jugadoresRes, perfilesRes, settingsRes] = await Promise.all([
      sb.from("profiles").select("*").eq("id", uid).single(),
      sb.from("players").select("*").eq("activo", true).order("posicion").order("ranking"),
      sb.from("profiles").select("id, email, nombre_google, player_id, aprobado"),
      sb.from("settings").select("*").eq("key", "presupuesto").single(),
    ]);

    const fallo = [perfilRes, jugadoresRes, perfilesRes, settingsRes].find((r) => r.error);
    if (fallo) return mostrarError("No se pudieron cargar los datos: " + fallo.error.message);

    const perfil = perfilRes.data;
    const jugadores = jugadoresRes.data;
    const perfiles = perfilesRes.data;
    const porId = Object.fromEntries(jugadores.map((j) => [j.id, j]));

    $("nombre-usuario").textContent = perfil.nombre_google || perfil.email;
    renderEstado(perfil, jugadores, perfiles, porId);
    if (perfil.is_admin) renderAdmin(perfiles, porId);
    $("panel-admin").hidden = !perfil.is_admin;
    renderPlantel(jugadores, settingsRes.data.value);
  }

  // ---------- ¿Quién sos? ----------
  function renderEstado(perfil, jugadores, perfiles, porId) {
    const caja = $("estado");
    caja.replaceChildren();
    caja.className = "estado";

    if (perfil.aprobado && perfil.player_id) {
      caja.append(
        el("h3", "Sos " + porId[perfil.player_id].nombre),
        el("p", "Tu cuenta está aprobada. El armado de equipos se habilita pronto.")
      );
      return;
    }

    caja.classList.add("pendiente");
    const tomados = new Set(perfiles.filter((p) => p.player_id && p.id !== perfil.id).map((p) => p.player_id));

    if (perfil.player_id) {
      caja.append(
        el("h3", "Elegiste a " + porId[perfil.player_id].nombre),
        el("p", "Falta que el admin apruebe tu cuenta. Si te equivocaste, podés cambiarlo abajo.")
      );
    } else {
      caja.append(
        el("h3", "¿Quién sos?"),
        el("p", "Elegí tu nombre del plantel. El admin lo confirma antes de que puedas jugar.")
      );
    }

    const select = el("select");
    select.append(el("option", "Elegí tu nombre…"));
    select.options[0].value = "";
    for (const j of jugadores) {
      if (tomados.has(j.id)) continue;
      const op = el("option", j.nombre);
      op.value = j.id;
      if (j.id === perfil.player_id) op.selected = true;
      select.append(op);
    }

    const boton = el("button", "Soy este jugador");
    boton.onclick = async () => {
      if (!select.value) return mostrarError("Elegí un nombre de la lista.");
      const { error } = await sb.rpc("reclamar_jugador", { p_player_id: Number(select.value) });
      if (error) return mostrarError(error.message);
      render((await sb.auth.getSession()).data.session);
    };

    const fila = el("div", undefined, "fila");
    fila.append(select, boton);
    caja.append(fila);
  }

  // ---------- Panel admin ----------
  function renderAdmin(perfiles, porId) {
    const lista = $("lista-pendientes");
    lista.replaceChildren();
    const pendientes = perfiles.filter((p) => p.player_id && !p.aprobado);

    if (!pendientes.length) {
      lista.append(el("p", "No hay cuentas esperando aprobación.", "nota"));
      return;
    }

    const tabla = el("table");
    for (const p of pendientes) {
      const tr = el("tr");
      tr.append(
        el("td", (p.nombre_google || p.email) + " dice ser " + porId[p.player_id].nombre)
      );
      const td = el("td", undefined, "precio");
      const boton = el("button", "Aprobar");
      boton.onclick = async () => {
        const { error } = await sb.from("profiles").update({ aprobado: true }).eq("id", p.id);
        if (error) return mostrarError(error.message);
        render((await sb.auth.getSession()).data.session);
      };
      td.append(boton);
      tr.append(td);
      tabla.append(tr);
    }
    lista.append(tabla);
  }

  // ---------- Plantel con cotizaciones ----------
  function renderPlantel(jugadores, presupuesto) {
    $("texto-presupuesto").textContent = "Presupuesto por equipo: " + presupuesto + " millones.";
    const cont = $("plantel");
    cont.replaceChildren();
    for (const [codigo, nombre] of Object.entries(POSICIONES)) {
      cont.append(el("h3", nombre));
      const tabla = el("table");
      for (const j of jugadores.filter((x) => x.posicion === codigo)) {
        const tr = el("tr");
        tr.append(el("td", j.nombre), el("td", Number(j.precio).toFixed(1), "precio"));
        tabla.append(tr);
      }
      cont.append(tabla);
    }
  }
</script>
</body>
</html>
